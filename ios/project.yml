name: Salio
configFiles:
  Debug: Salio.xcconfig
  Release: Salio.xcconfig
options:
  deploymentTarget:
    iOS: '18.0'
targets:
  Salio:
    type: application
    platform: iOS
    sources: App
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Salio
        NSLocationWhenInUseUsageDescription: Salio uses your location to find places nearby.
        NSLocationDefaultAccuracyReduced: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALIO_BUNDLE_ID)
        # The catalog only holds the launch colour; Salio has no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: '6.0'
  SalioTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: Salio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALIO_BUNDLE_ID).tests
        SWIFT_VERSION: '6.0'
  SalioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: Salio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALIO_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Salio
        SWIFT_VERSION: '6.0'
schemes:
  Salio:
    build:
      targets:
        Salio: all
    test:
      config: Debug
      targets:
        - SalioTests
        - SalioUITests
