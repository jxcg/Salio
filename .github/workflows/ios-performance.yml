name: iOS performance

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-performance.yml'

permissions:
  contents: read

concurrency:
  group: ios-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixed-search:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          # Include both parents of GitHub's pull-request merge commit.
          fetch-depth: 2
          persist-credentials: false
      - name: Compare stubbed search on one simulator
        run: |
          set -euo pipefail
          # The PR merge ref can be regenerated against a newer base than the event payload.
          base_sha=$(git rev-parse --verify HEAD^1)
          status=0
          git diff --no-ext-diff --quiet "$base_sha" HEAD -- ios/App/ ios/project.yml || status=$?
          case "$status" in
            0) echo 'iOS performance: app inputs unchanged; comparison skipped.' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            1) ;;
            *) exit "$status" ;;
          esac

          command -v xcodegen >/dev/null || brew install xcodegen
          work=$(mktemp -d)
          mkdir "$work/base"
          git archive "$base_sha" ios | tar -xf - -C "$work/base"
          cp ios/UITests/SearchPerformanceTests.swift "$work/base/ios/UITests/"

          for side in base pr; do
            source="$PWD/ios"
            if [[ "$side" == base ]]; then source="$work/base/ios"; fi
            xcodegen generate --spec "$source/project.yml"
            TEST_RUNNER_SALIO_PERF_ENABLED=1 xcodebuild -quiet test \
              -project "$source/Salio.xcodeproj" -scheme Salio \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
              -derivedDataPath "$work/build-$side" -resultBundlePath "$work/$side.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:SalioUITests/SearchPerformanceTests/testFixedSearch \
              SALIO_BUNDLE_ID=org.example.app CODE_SIGNING_ALLOWED=NO
            xcrun xcresulttool get test-results metrics --path "$work/$side.xcresult" > "$work/$side.json"
          done

          python3 ios/performance_report.py "$work/base.json" "$work/pr.json"
