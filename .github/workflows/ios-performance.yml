name: iOS performance

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch, tag, or commit to compare against
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: ios-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-search:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_ref }}
          path: .ci-base
          fetch-depth: 1
          persist-credentials: false
      - name: Compare stubbed search on one simulator
        run: |
          set -euo pipefail
          test -d .ci-base/ios/App && test -f .ci-base/ios/project.yml
          app_status=0
          diff -rq .ci-base/ios/App ios/App >/dev/null || app_status=$?
          project_status=0
          cmp -s .ci-base/ios/project.yml ios/project.yml || project_status=$?
          if [[ "$app_status" -gt 1 || "$project_status" -gt 1 ]]; then
            exit 2
          fi
          if [[ "$app_status" -eq 0 && "$project_status" -eq 0 ]]; then
            echo 'iOS performance: app inputs unchanged; comparison skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          command -v xcodegen >/dev/null || brew install xcodegen
          work=$(mktemp -d)
          cp ios/UITests/SearchPerformanceTests.swift .ci-base/ios/UITests/

          for side in base pr; do
            source="$PWD/ios"
            if [[ "$side" == base ]]; then source="$PWD/.ci-base/ios"; fi
            xcodegen generate --spec "$source/project.yml"
            TEST_RUNNER_SALIO_PERF_ENABLED=1 xcodebuild -quiet test \
              -project "$source/Salio.xcodeproj" -scheme Salio \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
              -derivedDataPath "$work/build-$side" -resultBundlePath "$work/$side.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:SalioUITests/SearchPerformanceTests/testFixedSearch \
              SALIO_BUNDLE_ID=org.example.app CODE_SIGNING_ALLOWED=NO
            xcrun xcresulttool get test-results metrics --path "$work/$side.xcresult" > "$work/$side.json"
          done

          python3 .github/scripts/performance_report.py "$work/base.json" "$work/pr.json"
